name: Sync App Store Data

on:
  schedule:
    - cron: '0 2 * * 1' # Todos los lunes a las 02:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run App Store Sync
        run: npm run sync:appstore
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          TRANSLATION_PROVIDER: mymemory
          TRANSLATION_TARGET_LOCALES: es,en
          AI_API_KEY: ${{ secrets.AI_API_KEY || vars.AI_API_KEY }}
          APP_STORE_REVIEW_PAGES: 10

      - name: Trigger Deploy Workflow
        run: gh workflow run deploy-pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
